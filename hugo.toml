# hugo.toml

baseURL = 'http://antarxly.com/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-CN'
hasCJKLanguage = true
title = 'Antarx Blog'
theme = 'Stack'

[permalinks]
page = '/:slug/'

[params]
mainSections = ["posts"]
rssFullContent = true

[params.author]
name = "gawainx"

[params.sidebar]
emoji = "💻"
subtitle = "AI Infra | Vibe Coding | SwiftUI"

[params.sidebar.avatar]
enabled = false

[params.article]
toc = true
readingTime = true

[params.article.license]
enabled = false

[params.comments]
enabled = false

[params.colorScheme]
toggle = true
default = "auto"

[params.widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]

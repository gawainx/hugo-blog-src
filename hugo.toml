# hugo.toml

baseURL = 'http://antarxly.com/'
title = 'Antarx Blog'
theme = 'Stack'

# Stack v4 i18n files are zh.toml (not zh-cn).
defaultContentLanguage = 'zh'
locale = 'zh-CN'
hasCJKLanguage = true

[permalinks]
page = '/:slug/'

[pagination]
pagerSize = 10

[params]
mainSections = ["posts"]
rssFullContent = true
favicon = "https://img.antarxly.com/landscape/webp/20260819-03a58e5d.webp"

[params.author]
name = "antarx"
email = "liangyi@bupt.edu.cn"

[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/gawainx"
weight = 1

[menu.social.params]
icon = "brand-github"
newTab = true

[params.footer]
since = 2015

[params.dateFormat]
published = ':date_full'
lastUpdated = ':date_full'

[params.sidebar]
emoji = "🤪"
subtitle = "AI Infra | Vibe Coding | SwiftUI"
compact = false
avatar = "https://img.antarxly.com/landscape/webp/20260819-03a58e5d.webp"

[params.article]
headingAnchor = true
math = true
toc = true
readingTime = true

[params.article.list]
showTags = false

[params.article.license]
enabled = false

[params.comments]
enabled = false

[params.cookies]
enabled = false

[params.colorScheme]
toggle = true
default = "auto"

[params.widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]

[related]
includeNewer = true
threshold = 60
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 200

[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = true

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = true
tabWidth = 4

# hugo.toml

baseURL = 'http://example.org/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
title = '我的技术博客'
theme = 'Stack'

[permalinks]
page = '/:slug/'

[params]
mainSections = ["posts"]
rssFullContent = true

[params.author]
name = "gawainx"

[params.sidebar]
emoji = "💻"
subtitle = "记录技术与想法"

[params.sidebar.avatar]
enabled = false

[params.article]
toc = true
readingTime = true

[params.article.license]
enabled = false

[params.comments]
enabled = false

[params.colorScheme]
toggle = true
default = "auto"

[params.widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]
